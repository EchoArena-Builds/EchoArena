<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Textos do site — Echo Arena Admin</title>

  <link rel="stylesheet" href="./css/admin.css">
  <link rel="stylesheet" href="./css/admin-shell.css">

  <style>
    .settings-page {
      display: grid;
      gap: 18px;
    }

    .settings-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 12px 0;
      background: var(--admin-bg, #0b1221);
    }

    .settings-toolbar-copy strong {
      display: block;
      font-size: 18px;
    }

    .settings-toolbar-copy span {
      display: block;
      margin-top: 5px;
      color: var(--admin-muted);
      font-size: 12px;
    }

    .settings-toolbar-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .settings-message {
      min-height: 22px;
      color: var(--admin-muted);
      font-size: 13px;
    }

    .settings-message.error {
      color: #ff8585;
    }

    .settings-message.ok {
      color: #4ade80;
    }

    .settings-card {
      padding: 20px;
      border: 1px solid var(--admin-line);
      border-radius: 14px;
      background: var(--admin-panel);
    }

    .settings-card-head {
      margin-bottom: 16px;
    }

    .settings-card-head h2 {
      margin: 0;
      font-size: 18px;
    }

    .settings-card-head p {
      margin: 6px 0 0;
      color: var(--admin-muted);
      font-size: 11.5px;
      line-height: 1.55;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .settings-field {
      display: grid;
      gap: 7px;
      min-width: 0;
    }

    .settings-field.full {
      grid-column: 1 / -1;
    }

    .settings-field label {
      color: #c8cfdd;
      font-size: 11.5px;
      font-weight: 700;
    }

    .settings-field .help {
      color: var(--admin-muted);
      font-size: 10px;
      line-height: 1.45;
    }

    .settings-field .counter {
      color: var(--admin-muted);
      font-size: 10px;
      text-align: right;
    }

    /* ---- interruptores ---- */

    .settings-toggles {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .settings-toggle {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid var(--admin-line);
      border-radius: 11px;
      background: #09111f;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }

    .settings-toggle:hover {
      border-color: var(--admin-line2, #31245c);
    }

    .settings-toggle input {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: #8b5cf6;
      cursor: pointer;
    }

    .settings-toggle-copy {
      min-width: 0;
    }

    .settings-toggle-copy strong {
      display: block;
      font-size: 12px;
    }

    .settings-toggle-copy span {
      display: block;
      margin-top: 3px;
      color: var(--admin-muted);
      font-size: 10px;
      line-height: 1.45;
    }

    /* ---- destaque para modo manutenção ---- */

    .settings-toggle.is-critical {
      border-color: #71303b;
      background: #1b0f16;
    }

    .settings-toggle.is-critical strong {
      color: #ff9aaa;
    }

    .settings-loading {
      padding: 36px;
      border: 1px dashed var(--admin-line);
      border-radius: 14px;
      background: var(--admin-panel);
      color: var(--admin-muted);
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 860px) {
      .settings-grid,
      .settings-toggles {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div data-admin-content>
    <section class="settings-page">

      <header class="settings-toolbar">
        <div class="settings-toolbar-copy">
          <strong>
            Textos e configurações do site
          </strong>

          <span>
            Identidade, redes sociais e regras de acesso do site público.
          </span>
        </div>

        <div class="settings-toolbar-actions">
          <button
            id="reload"
            class="admin-button"
            type="button"
          >
            Descartar
          </button>

          <button
            id="save"
            class="admin-button primary"
            type="button"
          >
            Salvar alterações
          </button>
        </div>
      </header>

      <div
        id="message"
        class="settings-message"
        role="status"
        aria-live="polite"
      ></div>

      <div id="settings-body">
        <div class="settings-loading">
          Carregando configurações...
        </div>
      </div>
    </section>
  </div>

  <script type="module">
    import { initAdminShell } from './js/admin-shell.js';

    const shell = await initAdminShell({
      activeId: 'site-texts',
      pageTitle: 'Textos do site',
      pageSubtitle: 'Configurações gerais'
    });

    if (shell) {
      await import('./js/site-texts.js');
    }
  </script>
</body>
</html>
