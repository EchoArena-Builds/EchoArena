<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script src="./js/guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heróis — Echo Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/site.css">
<style>
/* ---- controles ---- */
.tools{display:grid;grid-template-columns:minmax(0,1fr) minmax(140px,190px);gap:12px;
  padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.tools label{display:block;margin-bottom:7px;font-size:10.5px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.tools input,.tools select{width:100%;background:#150F2B;border:1px solid var(--line2);
  border-radius:9px;padding:10px 12px;color:var(--ink);font:inherit;font-size:13px}
.tools input:focus,.tools select:focus{outline:none;border-color:var(--pur)}

/* ---- grade ---- */
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:13px}

.hc{position:relative;border-radius:11px;overflow:hidden;background:var(--card);
  transition:.16s;cursor:pointer;border:1px solid transparent}
.hc::before{content:"";position:absolute;inset:0;z-index:5;border-radius:11px;padding:1.3px;
  pointer-events:none;background:var(--class-color,#C9A94A);opacity:.55;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude}
.hc:hover{transform:translateY(-3px)}
.hc:hover::before{opacity:1}
.hc .thumb{position:relative;aspect-ratio:112/125}
.hc .thumb .media{position:absolute;inset:0}
.hc .thumb .fade{position:absolute;inset:0;z-index:2;
  background:linear-gradient(0deg,#150F2B 4%,rgba(21,15,43,.55) 32%,transparent 62%)}
.hc .cap{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:9px 8px 11px;text-align:center}
.hc .cap .n{font-size:13.5px;font-weight:700;letter-spacing:.01em;color:var(--class-color,#fff)}
.hc .cap .r{font-size:11px;color:var(--dim);margin-top:1px}
.hc.off{opacity:.45;filter:grayscale(.6)}

/* ---- painel de detalhe ---- */
.hd-backdrop{position:fixed;inset:0;z-index:80;display:none;background:rgba(5,3,11,.78);
  backdrop-filter:blur(4px)}
.hd-backdrop.open{display:block}
.hd{position:fixed;top:0;right:0;bottom:0;z-index:81;width:min(430px,100%);
  display:flex;flex-direction:column;overflow:hidden;border-left:1px solid var(--line2);
  background:var(--panel);transform:translateX(100%);transition:transform .22s ease}
.hd.open{transform:translateX(0)}
.hd-art{position:relative;height:260px;flex:0 0 auto;
  background:radial-gradient(circle at 50% 30%,rgba(139,92,246,.22),transparent 55%),#0b0819}
.hd-art .media{position:absolute;inset:0}
.hd-art .veil{position:absolute;inset:0;z-index:2;
  background:linear-gradient(0deg,var(--panel) 3%,transparent 55%)}
.hd-close{position:absolute;top:14px;right:14px;z-index:5;width:34px;height:34px;
  border:1px solid var(--line2);border-radius:9px;background:rgba(10,7,20,.7);
  color:var(--dim);font-size:15px;backdrop-filter:blur(4px)}
.hd-body{flex:1;overflow-y:auto;padding:20px}
.hd-body h2{font-size:24px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;
  color:var(--class-color,var(--ink))}
.hd-sub{margin-top:5px;color:var(--dim);font-size:13px}
.hd-badges{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
.hd-badge{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 10px;border-radius:6px;border:1px solid var(--class-color,var(--line2));
  color:var(--class-color,var(--dim));background:#ffffff08}
.hd-badge.off{border-color:#71303b;color:#ff9aaa;background:#2a1016}
.hd-text{margin-top:6px;color:var(--dim);font-size:12.5px;line-height:1.7;white-space:pre-wrap}
.hd-section{margin-top:20px}
.hd-section h3{margin-bottom:10px;font-size:11px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint)}
.hd-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hd-stat{padding:12px 10px;border:1px solid var(--line);border-radius:10px;
  background:#0d0a1c;text-align:center}
.hd-stat span{display:block;color:var(--faint);font-size:9px;text-transform:uppercase;
  letter-spacing:.06em}
.hd-stat strong{display:block;margin-top:5px;font-size:19px}
.hd-cta{display:block;margin-top:20px;padding:13px;border-radius:10px;text-align:center;
  background:linear-gradient(180deg,#8B5CF6,#6D28D9);color:#fff;font-size:12.5px;
  font-weight:700;letter-spacing:.06em;text-transform:uppercase}

@media(max-width:1340px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(max-width:1080px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:640px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tools{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div data-site-content>

  <header class="page-head">
    <div>
      <h1>Heróis</h1>
      <p>Conheça todos os heróis disponíveis e suas classes.</p>
    </div>
    <div class="page-count" id="count">—</div>
  </header>

  <section class="tools">
    <div>
      <label for="search">Buscar</label>
      <input id="search" type="search" placeholder="Nome do herói..." autocomplete="off">
    </div>
    <div>
      <label for="sort">Ordenar</label>
      <select id="sort">
        <option value="ordem">Ordem de exibição</option>
        <option value="nome">Nome</option>
        <option value="builds">Mais usados</option>
      </select>
    </div>
  </section>

  <div class="filters" id="class-filters"></div>

  <section class="grid" id="grid">
    <div class="loading-card">Carregando heróis...</div>
  </section>

  <div class="hd-backdrop" id="hd-backdrop"></div>

<aside class="hd" id="hero-detail" aria-hidden="true">
  <div class="hd-art">
    <div class="media empty" id="hd-media"></div>
    <div class="veil"></div>
    <button class="hd-close" id="hd-close" aria-label="Fechar">✕</button>
  </div>
  <div class="hd-body" id="hd-body"></div>
</aside>

</div>


<script type="module" src="./js/herois.js"></script>
</body>
</html>
